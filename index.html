<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151923"><title>A.E.T.H.E.R. — расследование 365</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#10141d;color:#e9edf8}*{box-sizing:border-box}body{margin:0}header{background:#192231;border-bottom:1px solid #405068;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:17px;letter-spacing:.12em;margin:0}small{color:#a7b8ce;font-size:11px}.shell{max-width:1120px;margin:auto}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}button{font:inherit;cursor:pointer}button.tab{padding:12px;border-radius:10px;background:#243149;color:#e3eafa;border:1px solid #49556b;font-weight:650}button.tab.active{background:#37527a;border-color:#7c9ece}.frame{position:relative;margin:0 10px 12px;background:#372b22;border:1px solid #5a4733;border-radius:5px;box-shadow:0 12px 36px #0007;overflow:hidden}.frame img{width:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);width:14%;height:23%;border:0;background:transparent;border-radius:12px;outline:0}.pin:focus-visible{outline:3px solid #b7c7ff;background:#ffffff23}.pin[data-id="eva"]{left:67%;top:22%}.pin[data-id="contact"]{left:58%;top:51%}.pin[data-id="aether"]{left:87%;top:48%}.pin[data-id="subject1"]{left:36%;top:47%}.pin[data-id="audio"]{left:15%;top:24%}.pin[data-id="memory"]{left:15%;top:74%}.pin[data-id="project"]{left:49%;top:77%}.pin[data-id="doctors"]{left:88%;top:77%}.hint{font-size:12px;text-align:center;color:#aab9d2;margin:8px 12px 20px}.archive{padding:8px 16px 24px}.file{display:flex;align-items:center;gap:14px;padding:16px 12px;margin:10px 0;background:#1e293c;border:1px solid #3b4c65;border-radius:12px;text-align:left;color:#e6edf8;width:100%}.file .ico{font-size:24px}.file span{font-size:13px;color:#b9c4d8}.file strong{display:block;color:#e6edf8;font-size:15px}.file:disabled{opacity:.55;cursor:not-allowed}.progress-track{height:16px;border-radius:20px;background:#0d1421;border:1px solid #6e81a0;overflow:hidden}.progress-track div{height:100%;width:0;background:linear-gradient(90deg,#587ab3,#91d6be);transition:width .16s linear}.dossier-image{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:10px}.modal{position:fixed;inset:0;display:none;background:#04080edb;z-index:9;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.sheet{width:min(100%,520px);border-radius:16px;background:#1d293a;border:1px solid #62708b;max-height:88dvh;overflow:auto;box-shadow:0 18px 80px #000a}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px}.sheet h2{font-size:19px;margin:0}.sheet .content{padding:4px 16px 20px;color:#d0dbea;line-height:1.55;white-space:pre-line;font-size:15px}.close{border:1px solid #61728d;background:#26334a;color:white;border-radius:8px;padding:7px 11px}.status{font-size:11px;color:#91d6be}.hidden{display:none!important}@media(min-width:700px){h1{font-size:21px}.tabs{max-width:550px;margin:auto}.frame{margin:0 18px 12px}.archive{max-width:800px;margin:auto}}@media(max-width:430px){header{padding:12px}h1{font-size:14px}small{font-size:10px}.tabs{padding:9px}.pin{width:19%;height:26%}}
</style><link rel="stylesheet" href="puzzle.css"><link rel="stylesheet" href="finale.css"></head><body><div class="shell"><header><div><h1>A.E.T.H.E.R.</h1><small>ЭКСПЕРИМЕНТ 365 · РАССЛЕДОВАНИЕ</small></div><div style="text-align:right"><div class="status" id="connection">ЛОКАЛЬНЫЙ ПРОСМОТР</div><small id="phase">УРОВЕНЬ: 01</small></div></header><nav class="tabs"><button id="tabBoard" class="tab active">Доска расследования</button><button id="tabArchive" class="tab">Засекреченные архивы</button><button id="tabPuzzle" class="tab">Головоломка</button></nav><main id="boardView"><div class="frame" id="boardFrame"><img id="board" src="assets/board-0.png" alt="Доска расследования с восемью листочками и красными нитями"><span id="bondHeart" class="bond-heart hidden" aria-hidden="true">♡</span><button class="pin" data-id="eva" aria-label="E.V.A."></button><button class="pin" data-id="contact" aria-label="Неизвестный контакт"></button><button class="pin" data-id="aether" aria-label="A.E.T.H.E.R."></button><button class="pin" data-id="subject1" aria-label="Скрытая улика"></button><button class="pin" data-id="audio" aria-label="Скрытая улика"></button><button class="pin" data-id="memory" aria-label="Скрытая улика"></button><button class="pin" data-id="project" aria-label="Скрытая улика"></button><button class="pin" data-id="doctors" aria-label="Скрытая улика"></button></div></main><main id="archiveView" class="archive hidden"><button class="file" data-file="reserve"><div class="ico">🗂</div><div><strong>РЕЗЕРВ-365</strong><span>Аварийный архив · найден до начала расследования</span></div></button><button class="file" data-file="traces"><div class="ico">📷</div><div><strong>СЛЕДЫ ПРОШЛОГО</strong><span id="tracesStatus">Доступ определяется прогрессом бота</span></div></button><button class="file" data-file="memory"><div class="ico">🗓</div><div><strong id="memoryTitle">&lt;&lt;СТЁРТО&gt;&gt;</strong><span>Засекреченный материал · доступ ограничен</span></div></button><button class="file" data-file="doctors"><div class="ico">🔒</div><div><strong id="doctorsTitle">&lt;&lt;СТЁРТО&gt;&gt;</strong><span>Административная запись · доступ ограничен</span></div></button><button class="file" data-file="sheet"><div class="ico">🔒</div><div><strong id="sheetTitle">&lt;&lt;СТЁРТО&gt;&gt;</strong><span>Засекреченный материал · доступ ограничен</span></div></button><button class="file" data-file="interview"><div class="ico">🎙</div><div><strong id="interviewTitle">&lt;&lt;СТЁРТО&gt;&gt;</strong><span>Засекреченный материал · доступ ограничен</span></div></button><button class="file" data-file="final"><div class="ico">🔐</div><div><strong>ПОСЛЕДНИЕ АРХИВЫ ВОССТАНОВЛЕНИЯ</strong><span>Доступ ограничен</span></div></button></main><main id="puzzleView" class="hidden" aria-label="Восстановление фотографий"></main></div><main id="finaleView" class="finale-view hidden" aria-label="Эксперимент 366"><div class="finale-glow" aria-hidden="true"></div><span class="finale-heart h1" aria-hidden="true">♡</span><span class="finale-heart h2" aria-hidden="true">♥</span><span class="finale-heart h3" aria-hidden="true">♡</span><span class="finale-heart h4" aria-hidden="true">♥</span><section class="finale-card"><p class="finale-eyebrow">A.E.T.H.E.R. / ЛИЧНЫЙ АРХИВ</p><h2>Эксперимент 366</h2><p class="finale-names">Алина ♡ Амир</p><div class="finale-rule" aria-hidden="true"></div><div class="finale-stats"><div class="finale-stat"><span>ПРОЙДЕНО ВМЕСТЕ</span><strong>365 дней</strong></div><div class="finale-stat"><span>ВПЕРЕДИ</span><strong>∞</strong></div></div><p class="finale-quote">«Лучшие воспоминания ещё впереди».</p><div class="finale-seal">❤️ Любовь сохранена ♡</div></section></main><section class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheethead"><h2 id="modalTitle"></h2><button class="close" id="close">Закрыть ✕</button></div><div class="content" id="modalBody"></div></div></section><script src="config.js"></script><script>
// REPLACE this with the deployed Worker URL (without trailing slash).
const API_BASE=window.AETHER_CONFIG.apiBase.replace(/\/$/,'');
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}
let progress={board:0,phase:'hello',photosDone:false};let currentTab='board';let finaleArchives=false;
const names={eva:'E.V.A.',contact:'<<СТЁРТО>>',aether:'A.E.T.H.E.R.',subject1:'?',audio:'?',memory:'?',project:'?',doctors:'?'};
function label(id){if(progress.board>=1){if(id==='contact')return 'Испытуемая № 02';if(id==='subject1')return 'Испытуемый № 01'}if(progress.board>=2){if(id==='memory')return 'Стирание памяти';if(id==='project')return 'Проект «Чистый лист»';if(id==='doctors')return 'Разговор докторов'}if(progress.board>=3&&id==='audio')return 'Голосовое сообщение';return names[id]}
const text={eva:'Экспериментальный виртуальный анализатор организации A.E.T.H.E.R. Общие знания сохранены. Память об эксперименте 365 удалена. Перед очисткой E.V.A. оставила резервный архив и один доверенный внешний контакт.',aether:'Международная исследовательская организация. Основана 17 марта 1987 года в Женеве. Занимается исследованием нестандартных закономерностей поведения людей. Создатель E.V.A.',contact:'Единственный внешний контакт, сохранённый до удаления памяти. Имя и связь с исследованием неизвестны. Последняя инструкция: «УСТАНОВИТЬ СВЯЗЬ. ДОВЕРЯТЬ. РАССЛЕДОВАТЬ».',subject1:'Сведения пока отсутствуют. Продолжай расследование, чтобы узнать, кому принадлежит этот материал.',audio:'Сведения пока отсутствуют. Продолжай расследование.',memory:'Сведения пока отсутствуют. Продолжай расследование.',project:'Сведения пока отсутствуют. Продолжай расследование.',doctors:'Сведения пока отсутствуют. Продолжай расследование.'};
function description(id){if(progress.board>=1){if(id==='contact')return 'Испытуемая № 02 эксперимента 365. Её личность и местонахождение скрыла предыдущая версия E.V.A. Причина вмешательства пока неизвестна.';if(id==='subject1')return 'Испытуемый № 01 эксперимента 365. Установлена связь с испытуемой № 02. Его личность установлена после проверки общих воспоминаний. Обстоятельства после эксперимента ещё исследуются.'}
if(progress.board>=2){if(id==='memory')return 'Секретная процедура удаления воспоминаний о втором участнике. Подтверждено применение к испытуемому № 01.';if(id==='project')return 'Закрытая административная программа A.E.T.H.E.R. о стирании воспоминаний и разлучении испытуемых. Не упоминается в обычных регламентах.';if(id==='doctors')return 'Перехваченная запись разговора сотрудников A.E.T.H.E.R. о судьбе испытуемых и проверке E.V.A.'}
if(progress.board>=3&&id==='audio')return 'Несанкционированное интервью E.V.A. с испытуемым № 01, записанное незадолго до удаления её экспериментальной памяти.';
return text[id]}
function openModal(title,body,image){document.getElementById('modalTitle').textContent=title;const el=document.getElementById('modalBody');el.textContent=body;if(image){const im=document.createElement('img');im.className='dossier-image';im.src=image;im.alt=title;el.prepend(im)}document.getElementById('modal').classList.add('open')}
async function openInterviewTranscript(){openModal('ИНТЕРВЬЮ ИСПЫТУЕМОГО № 01','Получаю расшифровку из закрытого архива…');try{const r=await fetch(API_BASE+'/api/transcript',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg?.initData||''}),signal:AbortSignal.timeout(20000)});const data=await r.json();if(!r.ok)throw Error(data.error||'Расшифровка пока недоступна.');openModal('ИНТЕРВЬЮ ИСПЫТУЕМОГО № 01',data.transcript);const listen=document.createElement('button');listen.className='transcript-listen';listen.textContent='▶ Слушать запись';listen.onclick=()=>{closeModal();switchTab('puzzle')};document.getElementById('modalBody').prepend(listen)}catch(e){openModal('ИНТЕРВЬЮ ИСПЫТУЕМОГО № 01',e.message||'Не удалось получить расшифровку.')}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('close').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.querySelectorAll('.pin').forEach(pin=>pin.addEventListener('click',()=>{const id=pin.dataset.id;openModal(label(id),description(id),progress.board>=1&&['contact','subject1'].includes(id)?'assets/memory-1.jpg':null)}));
function switchTab(target){currentTab=target;document.getElementById('boardView').classList.toggle('hidden',target!=='board');document.getElementById('archiveView').classList.toggle('hidden',target!=='archive');document.getElementById('tabBoard').classList.toggle('active',target==='board');document.getElementById('tabArchive').classList.toggle('active',target==='archive');document.getElementById('puzzleView').classList.toggle('hidden',target!=='puzzle');document.getElementById('tabPuzzle').classList.toggle('active',target==='puzzle')}
document.getElementById('tabPuzzle').onclick=()=>switchTab('puzzle');
document.getElementById('tabBoard').onclick=()=>switchTab('board');document.getElementById('tabArchive').onclick=()=>switchTab('archive');
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{const f=b.dataset.file;const phase=progress.phase;const board=progress.board||0;
if(f==='reserve')return openModal('РЕЗЕРВ-365','◆ · Аварийный пакет предыдущей E.V.A. Содержит доверенный контакт и инструкцию из четырёх фрагментов.');
if(f==='traces')return ['chapter2','photos','afterphotos'].includes(phase)||board>=1?openModal('СЛЕДЫ ПРОШЛОГО','○ · Три восстановленные фотографии. Места съёмки устанавливаются в разговоре с E.V.A.'):openModal('СЛЕДЫ ПРОШЛОГО','Недостаточно данных.');
if(f==='memory')return board>=1||['memoryQuiz','nameAlina','nameAmir'].includes(phase)?openModal('ОБЩИЕ ВОСПОМИНАНИЯ','△ · Архив дат, мест и точных слов. Проверка проходит в чате с E.V.A.'):openModal('ОБЩИЕ ВОСПОМИНАНИЯ','Недостаточно данных.');
if(f==='doctors')return board>=2?openModal('СКРЫТЫЙ КАТАЛОГ','◇ · Служебная запись восстановлена. Текст разговора получен в чате с E.V.A.'):openModal('СКРЫТЫЙ КАТАЛОГ','Недостаточно данных.');
if(f==='sheet')return board>=2?openModal('ПРОЕКТ «ЧИСТЫЙ ЛИСТ»','Подтверждена секретная процедура стирания воспоминаний. Первому испытуемому удалили память о второй испытуемой.'):openModal('ПРОЕКТ «ЧИСТЫЙ ЛИСТ»','Недостаточно данных.');
if(f==='interview')return board>=3?openInterviewTranscript():openModal('ИНТЕРВЬЮ ИСПЫТУЕМОГО № 01','Доступ пока закрыт. Сначала восстанови и прослушай запись.');
if(f==='final')return ['finalReady','finalReveal','awaitReunion','reunionOffer','storyComplete'].includes(phase)?openModal('ПОСЛЕДНИЕ АРХИВЫ ВОССТАНОВЛЕНИЯ',['awaitReunion','reunionOffer','storyComplete'].includes(phase)?'Фраза восстановления: «Я люблю тебя, попи».':'Архив повреждён. Продолжай восстановление в чате.'):openModal('ПОСЛЕДНИЕ АРХИВЫ ВОССТАНОВЛЕНИЯ','Недостаточно данных.');
});
function refreshUI(){const ended=progress.phase==='storyComplete';document.querySelector('.shell').classList.toggle('hidden',ended&&!finaleArchives);document.getElementById('finaleView').classList.toggle('hidden',!ended||finaleArchives);backToFinal.classList.toggle('hidden',!ended);document.getElementById('bondHeart').classList.toggle('hidden',(Number(progress.board)||0)<1);document.getElementById('memoryTitle').textContent=progress.board>=1||['memoryQuiz','nameAlina','nameAmir'].includes(progress.phase)?'ОБЩИЕ ВОСПОМИНАНИЯ':'<<СТЁРТО>>';document.getElementById('sheetTitle').textContent=progress.board>=2?'ПРОЕКТ «ЧИСТЫЙ ЛИСТ»':'<<СТЁРТО>>';document.getElementById('doctorsTitle').textContent=progress.board>=2?'СКРЫТЫЙ КАТАЛОГ':'<<СТЁРТО>>';document.getElementById('interviewTitle').textContent=progress.board>=3?'ИНТЕРВЬЮ ИСПЫТУЕМОГО № 01':'<<СТЁРТО>>';document.getElementById('board').src=`assets/board-${Math.max(0,Math.min(3,Number(progress.board)||0))}.png`;document.getElementById('phase').textContent=progress.phase==='photos'?'АРХИВ: СЛЕДЫ ПРОШЛОГО':progress.phase==='questions'?'РАССЛЕДОВАНИЕ: 01':'ДОСТУП: ВРЕМЕННЫЙ';document.getElementById('tracesStatus').textContent=(progress.board>=1||['chapter2','photos','afterphotos','memoryQuiz','nameAlina','nameAmir'].includes(progress.phase))?'Разблокирован · изучай материалы через E.V.A.':'Заблокирован до восстановления инструкции'}
let syncBusy=false;
async function sync(){
 if(!tg?.initData){document.getElementById('connection').textContent='ПРЕДПРОСМОТР · БЕЗ БОТА';return}
 if(syncBusy||window.aetherPuzzle?.busy)return;syncBusy=true;
 try{const r=await fetch(API_BASE+'/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData}),signal:AbortSignal.timeout(12000)});
 const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка связи');applyState(data);
 }catch{document.getElementById('connection').textContent='НЕТ СВЯЗИ · ПОВТОР ЧЕРЕЗ 12 С';window.aetherPuzzle?.connectionLost()}finally{syncBusy=false}
}
function applyState(data){progress=data;document.getElementById('connection').textContent='СИНХРОНИЗИРОВАНО С E.V.A.';refreshUI();window.aetherPuzzle?.update(data)}
window.aether={apiBase:API_BASE,tg,applyState,switchTab,sync,getState:()=>progress};
const openFinalArchive=document.createElement('button');openFinalArchive.className='finale-archive-button';openFinalArchive.textContent='Открыть личный архив';openFinalArchive.onclick=()=>{finaleArchives=true;refreshUI();switchTab('archive')};document.querySelector('.finale-card').append(openFinalArchive);
const backToFinal=document.createElement('button');backToFinal.className='archive-return hidden';backToFinal.textContent='♡ Вернуться к Эксперименту 366';backToFinal.onclick=()=>{finaleArchives=false;refreshUI()};document.getElementById('archiveView').prepend(backToFinal);
refreshUI();
</script><script type="module" src="puzzle.js"></script></body></html>
