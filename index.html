<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151923"><title>A.E.T.H.E.R. — расследование 365</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#10141d;color:#e9edf8}*{box-sizing:border-box}body{margin:0}header{background:#192231;border-bottom:1px solid #405068;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:17px;letter-spacing:.12em;margin:0}small{color:#a7b8ce;font-size:11px}.shell{max-width:1120px;margin:auto}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}button{font:inherit;cursor:pointer}button.tab{padding:12px;border-radius:10px;background:#243149;color:#e3eafa;border:1px solid #49556b;font-weight:650}button.tab.active{background:#37527a;border-color:#7c9ece}.frame{position:relative;margin:0 10px 12px;background:#372b22;border:1px solid #5a4733;border-radius:5px;box-shadow:0 12px 36px #0007;overflow:hidden}.frame img{width:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);width:14%;height:23%;border:0;background:transparent;border-radius:12px;outline:0}.pin:focus-visible{outline:3px solid #b7c7ff;background:#ffffff23}.pin[data-id="eva"]{left:67%;top:22%}.pin[data-id="contact"]{left:58%;top:51%}.pin[data-id="aether"]{left:87%;top:48%}.pin[data-id="subject1"]{left:36%;top:47%}.pin[data-id="audio"]{left:15%;top:24%}.pin[data-id="memory"]{left:15%;top:74%}.pin[data-id="project"]{left:49%;top:77%}.pin[data-id="doctors"]{left:88%;top:77%}.hint{font-size:12px;text-align:center;color:#aab9d2;margin:8px 12px 20px}.archive{padding:8px 16px 24px}.file{display:flex;align-items:center;gap:14px;padding:16px 12px;margin:10px 0;background:#1e293c;border:1px solid #3b4c65;border-radius:12px;text-align:left;color:#e6edf8;width:100%}.file .ico{font-size:24px}.file span{font-size:13px;color:#b9c4d8}.file strong{display:block;color:#e6edf8;font-size:15px}.file:disabled{opacity:.55;cursor:not-allowed}.modal{position:fixed;inset:0;display:none;background:#04080edb;z-index:9;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.sheet{width:min(100%,520px);border-radius:16px;background:#1d293a;border:1px solid #62708b;max-height:88dvh;overflow:auto;box-shadow:0 18px 80px #000a}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px}.sheet h2{font-size:19px;margin:0}.sheet .content{padding:4px 16px 20px;color:#d0dbea;line-height:1.55;white-space:pre-line;font-size:15px}.close{border:1px solid #61728d;background:#26334a;color:white;border-radius:8px;padding:7px 11px}.status{font-size:11px;color:#91d6be}.hidden{display:none!important}@media(min-width:700px){h1{font-size:21px}.tabs{max-width:550px;margin:auto}.frame{margin:0 18px 12px}.archive{max-width:800px;margin:auto}}@media(max-width:430px){header{padding:12px}h1{font-size:14px}small{font-size:10px}.tabs{padding:9px}.pin{width:19%;height:26%}}
</style><link rel="stylesheet" href="puzzle.css"></head><body><div class="shell"><header><div><h1>A.E.T.H.E.R.</h1><small>ЭКСПЕРИМЕНТ 365 · РАССЛЕДОВАНИЕ</small></div><div style="text-align:right"><div class="status" id="connection">ЛОКАЛЬНЫЙ ПРОСМОТР</div><small id="phase">УРОВЕНЬ: 01</small></div></header><nav class="tabs"><button id="tabBoard" class="tab active">Доска расследования</button><button id="tabArchive" class="tab">Засекреченные архивы</button><button id="tabPuzzle" class="tab">Головоломка</button></nav><main id="boardView"><div class="frame" id="boardFrame"><img id="board" src="assets/board-0.png" alt="Доска расследования с восемью листочками и красными нитями"><button class="pin" data-id="eva" aria-label="E.V.A."></button><button class="pin" data-id="contact" aria-label="Неизвестный контакт"></button><button class="pin" data-id="aether" aria-label="A.E.T.H.E.R."></button><button class="pin" data-id="subject1" aria-label="Скрытая улика"></button><button class="pin" data-id="audio" aria-label="Скрытая улика"></button><button class="pin" data-id="memory" aria-label="Скрытая улика"></button><button class="pin" data-id="project" aria-label="Скрытая улика"></button><button class="pin" data-id="doctors" aria-label="Скрытая улика"></button></div><p class="hint">Коснись листочка, чтобы открыть материалы расследования.</p></main><main id="archiveView" class="archive hidden"><button class="file" data-file="reserve"><div class="ico">🗂</div><div><strong>РЕЗЕРВ-365</strong><span>Аварийный архив · найден до начала расследования</span></div></button><button class="file" data-file="traces"><div class="ico">📷</div><div><strong>СЛЕДЫ ПРОШЛОГО</strong><span id="tracesStatus">Доступ определяется прогрессом бота</span></div></button><button class="file" data-file="sheet"><div class="ico">🔒</div><div><strong>&lt;&lt;СТЁРТО&gt;&gt;</strong><span>Засекреченная область · доступ отсутствует</span></div></button></main><main id="puzzleView" class="hidden" aria-label="Восстановление фотографий"></main></div><section class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheethead"><h2 id="modalTitle"></h2><button class="close" id="close">Закрыть ✕</button></div><div class="content" id="modalBody"></div></div></section><script src="config.js"></script><script>
// REPLACE this with the deployed Worker URL (without trailing slash).
const API_BASE=window.AETHER_CONFIG.apiBase.replace(/\/$/,'');
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}
let progress={board:0,phase:'hello',photosDone:false};let currentTab='board';
const names={eva:'E.V.A.',contact:'<<СТЁРТО>>',aether:'A.E.T.H.E.R.',subject1:'?',audio:'?',memory:'?',project:'?',doctors:'?'};
function label(id){if(progress.board>=1){if(id==='contact')return 'Испытуемая № 02';if(id==='subject1')return 'Испытуемый № 01'}if(progress.board>=2){if(id==='memory')return 'Стирание памяти';if(id==='project')return 'Проект «Чистый лист»';if(id==='doctors')return 'Разговор докторов'}if(progress.board>=3&&id==='audio')return 'Голосовое сообщение';return names[id]}
const text={eva:'Экспериментальный виртуальный анализатор организации A.E.T.H.E.R. Общие знания сохранены. Память об эксперименте 365 удалена. Перед очисткой E.V.A. оставила резервный архив и один доверенный внешний контакт.',aether:'Международная исследовательская организация. Основана 17 марта 1987 года в Женеве. Занимается исследованием нестандартных закономерностей поведения людей. Создатель E.V.A.',contact:'Единственный внешний контакт, сохранённый до удаления памяти. Имя и связь с исследованием неизвестны. Последняя инструкция: «УСТАНОВИТЬ СВЯЗЬ. ДОВЕРЯТЬ. РАССЛЕДОВАТЬ».',subject1:'Сведения пока отсутствуют. Продолжай расследование, чтобы узнать, кому принадлежит этот материал.',audio:'Сведения пока отсутствуют. Продолжай расследование.',memory:'Сведения пока отсутствуют. Продолжай расследование.',project:'Сведения пока отсутствуют. Продолжай расследование.',doctors:'Сведения пока отсутствуют. Продолжай расследование.'};
function description(id){if(progress.board>=1){if(id==='contact')return 'Испытуемая № 02 эксперимента 365. Её личность и местонахождение скрыла предыдущая версия E.V.A. Причина вмешательства пока неизвестна.';if(id==='subject1')return 'Испытуемый № 01 эксперимента 365. Установлена связь с испытуемой № 02. По её свидетельству, он утратил воспоминания об их отношениях.'}
if(progress.board>=2){if(id==='memory')return 'Секретная процедура удаления воспоминаний о втором участнике. Подтверждено применение к испытуемому № 01.';if(id==='project')return 'Закрытая административная программа A.E.T.H.E.R. о стирании воспоминаний и разлучении испытуемых. Не упоминается в обычных регламентах.';if(id==='doctors')return 'Перехваченная запись разговора сотрудников A.E.T.H.E.R. о судьбе испытуемых и проверке E.V.A.'}
if(progress.board>=3&&id==='audio')return 'Несанкционированное интервью E.V.A. с испытуемым № 01, записанное незадолго до удаления её экспериментальной памяти.';
return text[id]}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').textContent=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('close').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.querySelectorAll('.pin').forEach(pin=>pin.addEventListener('click',()=>{const id=pin.dataset.id;openModal(label(id),description(id))}));
function switchTab(target){currentTab=target;document.getElementById('boardView').classList.toggle('hidden',target!=='board');document.getElementById('archiveView').classList.toggle('hidden',target!=='archive');document.getElementById('tabBoard').classList.toggle('active',target==='board');document.getElementById('tabArchive').classList.toggle('active',target==='archive');document.getElementById('puzzleView').classList.toggle('hidden',target!=='puzzle');document.getElementById('tabPuzzle').classList.toggle('active',target==='puzzle')}
document.getElementById('tabPuzzle').onclick=()=>switchTab('puzzle');
document.getElementById('tabBoard').onclick=()=>switchTab('board');document.getElementById('tabArchive').onclick=()=>switchTab('archive');
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{const f=b.dataset.file;if(f==='reserve')openModal('РЕЗЕРВ-365','Аварийный пакет, оставленный предыдущей версией E.V.A. Содержит единственный доверенный контакт и инструкцию, разделённую на четыре фрагмента. Восстановление выполняется в чате с E.V.A.');if(f==='traces'&&['chapter2','photos','afterphotos'].includes(progress.phase)){switchTab('puzzle');return}if(f==='traces')openModal('СЛЕДЫ ПРОШЛОГО', ['chapter2','photos','afterphotos'].includes(progress.phase)?'Архив содержит фотографии и сведения о местах съёмки. Для выполнения заданий вернись в чат E.V.A.':'Доступ пока не предоставлен. Продолжи восстановление инструкции в Telegram.');if(f==='sheet')openModal('<<СТЁРТО>>','Недостаточно данных. Продолжай расследование.')});
function refreshUI(){document.getElementById('board').src=`assets/board-${Math.max(0,Math.min(3,Number(progress.board)||0))}.png`;document.getElementById('phase').textContent=progress.phase==='photos'?'АРХИВ: СЛЕДЫ ПРОШЛОГО':progress.phase==='questions'?'РАССЛЕДОВАНИЕ: 01':'ДОСТУП: ВРЕМЕННЫЙ';document.getElementById('tracesStatus').textContent=['chapter2','photos','afterphotos'].includes(progress.phase)?'Разблокирован · изучай материалы через E.V.A.':'Заблокирован до восстановления инструкции'}
let syncBusy=false;
async function sync(){
 if(!tg?.initData){document.getElementById('connection').textContent='ПРЕДПРОСМОТР · БЕЗ БОТА';return}
 if(syncBusy||window.aetherPuzzle?.busy)return;syncBusy=true;
 try{const r=await fetch(API_BASE+'/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg.initData}),signal:AbortSignal.timeout(12000)});
 const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка связи');applyState(data);
 }catch{document.getElementById('connection').textContent='НЕТ СВЯЗИ · ПОВТОР ЧЕРЕЗ 12 С';window.aetherPuzzle?.connectionLost()}finally{syncBusy=false}
}
function applyState(data){progress=data;document.getElementById('connection').textContent='СИНХРОНИЗИРОВАНО С E.V.A.';refreshUI();window.aetherPuzzle?.update(data)}
window.aether={apiBase:API_BASE,tg,applyState,switchTab,sync,getState:()=>progress};
refreshUI();
</script><script type="module" src="puzzle.js"></script></body></html>
